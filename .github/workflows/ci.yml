name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false   # 仅标准库，没有 go.sum，关闭依赖缓存以消除警告
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt 未格式化的文件"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build
        run: make build
      - name: smoke test
        run: |
          ./jsonviewer -listen 127.0.0.1:18080 &
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:18080/
          curl -fsS -o /dev/null http://127.0.0.1:18080/js/app.js
          curl -fsS -o /dev/null http://127.0.0.1:18080/js/vendor/codemirror.bundle.js
          curl -fsS -o /dev/null http://127.0.0.1:18080/js/formats.js
          curl -fsS -o /dev/null http://127.0.0.1:18080/js/vendor/yaml.bundle.js
          curl -fsS -o /dev/null http://127.0.0.1:18080/js/vendor/toml.bundle.js
          kill %1
      - name: e2e (headless Chrome)
        run: |
          npm ci
          CHROME="$(which google-chrome || which chromium-browser || which chromium)" npm run test:e2e
      - name: formats (headless Chrome)
        run: CHROME="$(which google-chrome || which chromium-browser || which chromium)" npm run test:formats
