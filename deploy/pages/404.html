<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 - 页面不存在 | JSON在线视图查看器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 16px;
      font: 13px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      color: #222; background: #f3f5f8;
    }
    .card {
      width: 100%; max-width: 420px; padding: 28px 28px 24px; text-align: center;
      background: #fff; border: 1px solid #d9dee5; border-radius: 4px;
    }
    .code { margin: 0; font-size: 44px; font-weight: 600; line-height: 1.1; color: #3b7ddd; }
    h1 { margin: 10px 0 6px; font-size: 16px; font-weight: 600; color: #2c3440; }
    p { margin: 0 0 18px; color: #7a8494; }
    a {
      display: inline-block; padding: 0 14px; line-height: 28px; text-decoration: none;
      color: #fff; background: #3b7ddd; border: 1px solid #3b7ddd; border-radius: 3px;
    }
    a:hover { background: #326cc2; border-color: #326cc2; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>页面不存在</h1>
    <p>你访问的地址没有对应的页面，可能已被移除或链接有误。</p>
    <a href="/">返回首页</a>
  </main>
</body>
</html>
